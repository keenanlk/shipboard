name: Feature request
description: Suggest an idea or improvement for ShipBoard
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that ShipBoard doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you'd like.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Related provider (optional)
      multiple: true
      options:
        - AWS CodePipeline
        - GitHub Actions
        - GitLab CI
        - Vercel
        - Netlify
        - A new provider
        - General / not provider-specific
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a similar request.
          required: true
